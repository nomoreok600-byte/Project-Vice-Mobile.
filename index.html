    <script>
        // Audio & Haptic Utility Helper
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            },
            play(type) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    const now = this.ctx.currentTime;

                    if (type === 'tap') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                        osc.start(now);
                        osc.stop(now + 0.08);
                    } else if (type === 'score') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(523.25, now); // C5
                        osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                    } else if (type === 'error') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(180, now);
                        osc.frequency.linearRampToValueAtTime(90, now + 0.2);
                        gain.gain.setValueAtTime(0.25, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                    } else if (type === 'win') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.setValueAtTime(554.37, now + 0.1);
                        osc.frequency.setValueAtTime(659.25, now + 0.2);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                    }
                } catch(e) {}
            }
        };

        function vibrate(pattern = 30) {
            if (navigator.vibrate) {

            }
        }

        // Game definitions data structure
        const GAMES = [

            {

                desc: 'Unscramble everyday rapid words against AI timer.',

                color: 'from-purple-600 to-pink-500',

            },
            {
                id: 'rhythm',

                desc: 'Tap pulsing rhythm notes precisely in time with AI.',
                icon: '🎵',
                color: 'from-rose-500 to-red-600',

            {

        ];

        // Highscore store helper
        function getHighScore(gameId) {
            return parseInt(localStorage.getItem('neon_hub_' + gameId) || '0', 10);
        }
        function setHighScore(gameId, score) {
            const current = getHighScore(gameId);
            if (score > current) {
                localStorage.setItem('neon_hub_' + gameId, score);
                return true;
            }
            return false;
        }

        // Active game handler reference
        let currentGameInterval = null;
        let currentGameListener = null;

        function clearActiveGame() {
            if (currentGameInterval) {
                clearInterval(currentGameInterval);
                currentGameInterval = null;
            }
            if (currentGameListener) {
                window.removeEventListener('keydown', currentGameListener);
                currentGameListener = null;
            }
        }

        function returnToMenu() {
            clearActiveGame();
            document.getElementById('header-controls').classList.add('hidden');
            renderMenu();
        }

        // Render Main Menu
        function renderMenu() {
            const container = document.getElementById('app-container');

                </div>
                <div class="grid grid-cols-1 gap-3.5">
            `;

            GAMES.forEach(g => {
                const best = getHighScore(g.id);
                html += `
                    <div onclick="launchGame('${g.id}')" class="group bg-cardBg hover:bg-slate-800/80 border border-slate-800 hover:border-slate-700 rounded-2xl p-4 flex items-center justify-between cursor-pointer transition-all active:scale-[0.98] shadow-lg">
                        <div class="flex items-center space-x-3.5">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-tr ${g.color} flex items-center justify-center text-2xl shadow-md group-hover:scale-105 transition-transform">
                                ${g.icon}
                            </div>
                            <div>
                                <h3 class="font-bold text-sm text-white group-hover:text-cyan-400 transition-colors">${g.title}</h3>

                            </div>
                        </div>
                        <div class="text-right pl-2">
                            <div class="text-[10px] uppercase font-bold text-slate-500">Best</div>
                            <div class="text-sm font-extrabold text-cyan-400">${best}</div>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function launchGame(gameId) {
            clearActiveGame();
            document.getElementById('header-controls').classList.remove('hidden');
            const container = document.getElementById('app-container');
            
            switch(gameId) {
                case 'gridtap': initGridTap(container); break;
                case 'pong': initPong(container); break;
                case 'colorswitch': initColorSwitch(container); break;
                case 'memory': initMemory(container); break;
                case 'mathblitz': initMathBlitz(container); break;
                case 'swipedodge': initSwipeDodge(container); break;
                case 'coindrop': initCoinDrop(container); break;
                case 'wordrush': initWordRush(container); break;
                case 'rhythm': initRhythm(container); break;
                case 'snake': initSnake(container); break;
            }
        }

        // ==========================================
        // 1. GRID TAP BLITZ
        // ==========================================
        function initGridTap(container) {
            container.innerHTML = `
                <div class="flex flex-col h-full space-y-4">
                    <div class="flex justify-between items-center bg-cardBg p-3 rounded-2xl border border-slate-800">
                        <div><div class="text-[10px] font-bold text-slate-400">YOU</div><div id="gt-score" class="text-xl font-black text-cyan-400">0</div></div>
                        <div><div class="text-[10px] font-bold text-slate-400">AI GHOST</div><div id="gt-aiscore" class="text-xl font-black text-purple-400">0</div></div>
                        <div class="text-right"><div class="text-[10px] font-bold text-slate-400">BEST</div><div class="text-xl font-black text-slate-200" id="gt-best">${getHighScore('gridtap')}</div></div>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold text-slate-300"><span>TIME LEFT</span><span id="gt-time">5.00s</span></div>
                        <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden"><div id="gt-timer-bar" class="bg-gradient-to-r from-cyan-500 to-green-400 h-full w-full transition-all"></div></div>
                    </div>
                    <div id="gt-board" class="grid grid-cols-3 gap-3 aspect-square my-auto"></div>
                    <div id="gt-msg" class="text-center text-xs font-bold text-slate-400">Tap the green tile before time runs out!</div>
                </div>
            `;

            let score = 0, aiScore = 0, timeLeft = 5.0, activeIndex = -1, isOver = false;
            let aiTimer = 0.6; // AI scores every 0.6s

            const board = document.getElementById('gt-board');
            for(let i=0; i<9; i++) {
                const tile = document.createElement('div');
                tile.className = 'bg-slate-800/80 rounded-2xl border border-slate-700/50 cursor-pointer transition-transform active:scale-90 flex items-center justify-center';
                tile.dataset.index = i;
                tile.addEventListener('click', () => handleTap(i));
                board.appendChild(tile);
            }

            function nextRound() {
                if (isOver) return;
                activeIndex = Math.floor(Math.random() * 9);
                renderTiles();
            }

            function renderTiles() {
                const tiles = board.children;
                for(let i=0; i<tiles.length; i++) {
                    if (i === activeIndex) {
                        tiles[i].className = 'bg-neonGreen rounded-2xl border border-emerald-400 cursor-pointer transition-transform active:scale-90 flex items-center justify-center glow-green';
                        tiles[i].innerHTML = '<div class="w-4 h-4 bg-emerald-900 rotate-45 rounded-sm"></div>';
                    } else {
                        tiles[i].className = 'bg-slate-800/80 rounded-2xl border border-slate-700/50 cursor-pointer transition-transform active:scale-90 flex items-center justify-center';
                        tiles[i].innerHTML = '';
                    }
                }
            }

            function handleTap(idx) {
                if (isOver) return;
                if (idx === activeIndex) {
                    AudioFX.play('tap');
                    vibrate(30);
                    score++;
                    timeLeft = Math.min(6.0, timeLeft + 0.4);
                    document.getElementById('gt-score').textContent = score;
                    nextRound();
                } else {
                    gameOver("Wrong tile tapped!");
                }
            }

            function gameOver(reason) {
                isOver = window.isGameOver = true;
                clearActiveGame();
                AudioFX.play('error');
                vibrate(100);
                const isNew = setHighScore('gridtap', score);
                container.innerHTML = `
                    <div class="my-auto text-center space-y-4 bg-cardBg p-6 rounded-3xl border border-slate-800 shadow-xl">
                        <div class="text-4xl">⚡</div>
                        <h2 class="text-xl font-extrabold text-white">GAME OVER</h2>
                        <p class="text-xs text-slate-400">${reason}</p>
                        <div class="grid grid-cols-2 gap-3 py-2">
                            <div class="bg-slate-900/60 p-3 rounded-2xl"><div class="text-xs text-slate-500">Your Score</div><div class="text-2xl font-black text-cyan-400">${score}</div></div>
                            <div class="bg-slate-900/60 p-3 rounded-2xl"><div class="text-xs text-slate-500">AI Ghost</div><div class="text-2xl font-black text-purple-400">${aiScore}</div></div>
                        </div>
                        ${isNew ? '<div class="text-xs font-bold text-amber-400 animate-pulse">🎉 NEW PERSONAL BEST!</div>' : ''}
                        <button onclick="launchGame('gridtap')" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition">PLAY AGAIN</button>
                    </div>
                `;
            }

            nextRound();
            currentGameInterval = setInterval(() => {
                if (isOver) return;
                timeLeft -= 0.05;
                if (timeLeft <= 0) {
                    gameOver("Time ran out!");
                    return;
                }
                document.getElementById('gt-time').textContent = timeLeft.toFixed(2) + 's';
                document.getElementById('gt-timer-bar').style.width = (timeLeft / 6.0 * 100) + '%';

                // AI Progress
                aiTimer -= 0.05;
                if (aiTimer <= 0) {
                    aiScore++;
                    document.getElementById('gt-aiscore').textContent = aiScore;
                    aiTimer = Math.max(0.3, 0.6 - (score * 0.005));
                    if (aiScore > score + 10) {
                        gameOver("AI Ghost outpaced you!");
                    }
                }
            }, 50);
        }

        // ==========================================
        // 2. NEON PONG SOLO (AI Wall)
        // ==========================================
        void function initPong(container) {
            container.innerHTML = `
                <div class="flex flex-col h-full space-y-3">
                    <div class="flex justify-between items-center bg-cardBg p-3 rounded-2xl border border-slate-800">
                        <div><div class="text-[10px] font-bold text-slate-400">SCORE</div><div id="p-score" class="text-xl font-black text-purple-400">0</div></div>
                        <div class="text-right"><div class="text-[10px] font-bold text-slate-400">BEST</div><div class="text-xl font-black text-slate-200">${getHighScore('pong')}</div></div>
                    </div>
                    <div class="relative w-full aspect-[3/4] bg-slate-950 rounded-3xl border border-slate-800 overflow-hidden touch-none" id="pong-area">
                        <canvas id="pong-canvas" class="w-full h-full block"></canvas>
                    </div>
                    <p class="text-center text-xs text-slate-400">Drag paddle left/right or use touch to bounce ball.</p>
                </div>
            `;

            const canvas = document.getElementById('pong-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 350; canvas.height = 450;

            let score = 0, isOver = false;
            let ball = { x: 175, y: 100, vx: 3, vy: 4, radius: 8 };
            let paddle = { x: 140, y: 420, w: 90, h: 14 };
            let aiPaddle = { x: 140, y: 16, w: 90, h: 14 };

            const area = document.getElementById('pong-area');
            area.addEventListener('touchmove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, touchX - paddle.w/2));
            });
            area.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, mouseX - paddle.w/2));
            });

            currentGameInterval = setInterval(() => {
                if (isOver) return;

                // Move Ball
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Wall bounce
                if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                    ball.vx *= -1;
                    AudioFX.play('tap');
                }

                // AI Paddle Track
                aiPaddle.x += (ball.x - (aiPaddle.x + aiPaddle.w/2)) * 0.08;
                aiPaddle.x = Math.max(0, Math.min(canvas.width - aiPaddle.w, aiPaddle.x));

                // AI paddle bounce
                if (ball.y - ball.radius <= aiPaddle.y + aiPaddle.h && ball.x >= aiPaddle.x && ball.x <= aiPaddle.x + aiPaddle.w) {
                    ball.vy *= -1;
                    ball.y = aiPaddle.y + aiPaddle.h + ball.radius;
                    AudioFX.play('tap');
                }

                // Player paddle bounce
                if (ball.y + ball.radius >= paddle.y && ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
                    ball.vy *= -1;
                    ball.y = paddle.y - ball.radius;
                    score++;
                    document.getElementById('p-score').textContent = score;
                    AudioFX.play('score');
                    vibrate(30);
                    // Slight speed increase
                    ball.vx *= 1.02;
                    ball.vy *= 1.02;
                }

                // Floor check (Game Over)
                if (ball.y > canvas.height) {
                    isOver = true;
                    clearActiveGame();
                    AudioFX.play('error');
                    vibrate(100);
                    const isNew = setHighScore('pong', score);
                    container.innerHTML = `
                        <div class="my-auto text-center space-y-4 bg-cardBg p-6 rounded-3xl border border-slate-800 shadow-xl">
                            <div class="text-4xl">🏓</div>
                            <h2 class="text-xl font-extrabold text-white">GAME OVER</h2>
                            <p class="text-xs text-slate-400">The ball slipped past your paddle!</p>
                            <div class="bg-slate-900/60 p-3 rounded-2xl"><div class="text-xs text-slate-500">Final Score</div><div class="text-2xl font-black text-purple-400">${score}</div></div>
                            ${isNew ? '<div class="text-xs font-bold text-amber-400 animate-pulse">🎉 NEW PERSONAL BEST!</div>' : ''}
                            <button onclick="launchGame('pong')" class="w-full py-3 bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition">PLAY AGAIN</button>
                        </div>
                    `;
                    return;
                }

                // Ceiling bounce if AI misses
                if (ball.y < 0) {
                    ball.vy *= -1;
                }

                // Render Canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw Ball
                ctx.fillStyle = '#ec4899';
                ctx.shadowColor = '#ec4899'; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;

                // Draw AI Paddle
                ctx.fillStyle = '#a855f7';
                ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);

                // Draw Player Paddle
                ctx.fillStyle = '#06b6d4';
                ctx.shadowColor = '#06b6d4'; ctx.shadowBlur = 10;
                ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
                ctx.shadowBlur = 0;

            }, 1000 / 60);
        }

        // ==========================================
        // 3. COLOR SWITCH REFLEX
        // ==========================================
        function initColorSwitch(container) {
            const COLORS = ['#06b6d4', '#a855f7', '#ec4899', '#10b981'];
            const COLOR_NAMES = ['CYAN', 'PURPLE', 'PINK', 'GREEN'];
            
            container.innerHTML = `
                <div class="flex flex-col h-full space-y-4">
                    <div class="flex justify-between items-center bg-cardBg p-3 rounded-2xl border border-slate-800">
                        <div><div class="text-[10px] font-bold text-slate-400">SCORE</div><div id="cs-score" class="text-xl font-black text-pink-400">0</div></div>
                        <div class="text-right"><div class="text-[10px] font-bold text-slate-400">BEST</div><div class="text-xl font-black text-slate-200">${getHighScore('colorswitch')}</div></div>

        // ==========================================
        // 7. COIN DROP CATCHER
        // ==========================================
        function initCoinDrop(container) {
            container.innerHTML = `
                <div class="flex flex-col h-full space-y-3">
                    <div class="flex justify-between items-center bg-cardBg p-3 rounded-2xl border border-slate-800">
                        <div><div class="text-[10px] font-bold text-slate-400">SCORE</div><div id="cd-score" class="text-xl font-black text-yellow-400">0</div></div>
                        <div class="text-right"><div class="text-[10px] font-bold text-slate-400">BEST</div><div class="text-xl font-black text-slate-200">${getHighScore('coindrop')}</div></div>
                    </div>
                    <div class="relative w-full aspect-[3/4] bg-slate-950 rounded-3xl border border-slate-800 overflow-hidden touch-none" id="cd-area">
                        <canvas id="cd-canvas" class="w-full h-full block"></canvas>
                    </div>
                    <p class="text-center text-xs text-slate-400">Slide left/right to catch coins & dodge spikes!</p>
                </div>
            `;

            const canvas = document.getElementById('cd-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 350; canvas.height = 450;

            let score = 0, isOver = false;
            let basket = { x: 140, y: 400, w: 70, h: 20 };
            let items = [];

            const area = document.getElementById('cd-area');
            area.addEventListener('touchmove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const touchX = e.touches[0].clientX - rect.left;
                basket.x = Math.max(0, Math.min(canvas.width - basket.w, touchX - basket.w/2));
            });
            area.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                basket.x = Math.max(0, Math.min(canvas.width - basket.w, mouseX - basket.w/2));
            });

            let spawnTimer = 0;

            currentGameInterval = setInterval(() => {
                if (isOver) return;

                spawnTimer++;
                if (spawnTimer > 35) {
                    spawnTimer = 0;
                    items.push({
                        x: Math.random() * (canvas.width - 20),
                        y: -20,
                        vy: Math.random() * 2 + 3,
                        isSpike: Math.random() > 0.75,
                        radius: 12
                    });
                }

                // Update items
                for (let i = items.length - 1; i >= 0; i--) {
                    items[i].y += items[i].vy;

                    // Check collision with basket
                    if (items[i].y + items[i].radius >= basket.y && 
                        items[i].x >= basket.x - 10 && 
                        items[i].x <= basket.x + basket.w + 10) {
                        
                        if (items[i].isSpike) {
                            isOver = true;
                            clearActiveGame();
                            AudioFX.play('error');
                            vibrate(100);
                            const isNew = setHighScore('coindrop', score);
                            container.innerHTML = `
                                <div class="my-auto text-center space-y-4 bg-cardBg p-6 rounded-3xl border border-slate-800 shadow-xl">
                                    <div class="text-4xl">🪙</div>
                                    <h2 class="text-xl font-extrabold text-white">GAME OVER</h2>
                                    <p class="text-xs text-slate-400">You caught a red spike!</p>
                                    <div class="bg-slate-900/60 p-3 rounded-2xl"><div class="text-xs text-slate-500">Score</div><div class="text-2xl font-black text-yellow-400">${score}</div></div>
                                    ${isNew ? '<div class="text-xs font-bold text-amber-400 animate-pulse">🎉 NEW PERSONAL BEST!</div>' : ''}
                                    <button onclick="launchGame('coindrop')" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-amber-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition">PLAY AGAIN</button>
                                </div>
                            `;
                            return;
                        } else {
                            score++;
                            document.getElementById('cd-score').textContent = score;
                            AudioFX.play('score');
                            vibrate(30);
                            items.splice(i, 1);
                            continue;
                        }
                    }

                    // Remove out of bounds
                    if (items[i] && items[i].y > canvas.height) {
                        items.splice(i, 1);
                    }
                }

                // Render Canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Items
                items.forEach(it => {
                    ctx.beginPath();
                    ctx.arc(it.x, it.y, it.radius, 0, Math.PI*2);
                    ctx.fillStyle = it.isSpike ? '#ef4444' : '#eab308';
                    ctx.shadowColor = it.isSpike ? '#ef4444' : '#eab308';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                // Draw Basket
                ctx.fillStyle = '#f59e0b';
                ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 12;
                ctx.fillRect(basket.x, basket.y, basket.w, basket.h);
                ctx.shadowBlur = 0;

            }, 1000 / 60);
        }

                        <button onclick="submitWord()" class="w-full py-3 bg-purple-600 hover:bg-purple-500 rounded-2xl font-extrabold text-white shadow-lg active:scale-95 transition">SUBMIT</button>
                    </div>
                </div>
            `;

            let score = 0, currentWord = '', timeLeft = 5.0, isOver = false;

            function nextWord() {
                if (isOver) return;
                currentWord = WORDS[Math.floor(Math.random() * WORDS.length)];
                let scrambled = currentWord.split('').sort(() => Math.random() - 0.5).join('');
                if (scrambled === currentWord) scrambled = currentWord.split('').reverse().join('');
                document.getElementById('wr-scrambled').textContent = scrambled;
                document.getElementById('wr-input').value = '';
                timeLeft = Math.max(2.5, 5.0 - (score * 0.1));
            }

            window.submitWord = function() {
                if (isOver) return;
                const val = document.getElementById('wr-input').value.trim().toUpperCase();
                if (val === currentWord) {
                    AudioFX.play('score');
                    vibrate(30);
                    score++;
                    document.getElementById('wr-score').textContent = score;
                    nextWord();
                } else {
                    AudioFX.play('error');
                    vibrate(50);
                    document.getElementById('wr-input').classList.add('border-red-500');
                    setTimeout(() => document.getElementById('wr-input').classList.remove('border-red-500'), 400);
                }
            };

            function gameOver(reason) {
                isOver = window.isGameOver = true;
                clearActiveGame();
                AudioFX.play('error');
                vibrate(100);
                const isNew = setHighScore('wordrush', score);
                container.innerHTML = `
                    <div class="my-auto text-center space-y-4 bg-cardBg p-6 rounded-3xl border border-slate-800 shadow-xl">
                        <div class="text-4xl">🔤</div>
                        <h2 class="text-xl font-extrabold text-white">GAME OVER</h2>
                        <p class="text-xs text-slate-400">${reason}</p>
                        <div class="bg-slate-900/60 p-3 rounded-2xl"><div class="text-xs text-slate-500">Score</div><div class="text-2xl font-black text-purple-400">${score}</div></div>
                        ${isNew ? '<div class="text-xs font-bold text-amber-400 animate-pulse">🎉 NEW PERSONAL BEST!</div>' : ''}
                        <button onclick="launchGame('wordrush')" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition">PLAY AGAIN</button>
                    </div>
                `;
            }

            nextWord();
            currentGameInterval = setInterval(() => {
                if (isOver) return;
                timeLeft -= 0.05;
                if (timeLeft <= 0) {
                    gameOver("Time ran out!");
                    return;
                }
                document.getElementById('wr-time').textContent = timeLeft.toFixed(2) + 's';
                document.getElementById('wr-timer').style.width = (timeLeft / 5.0 * 100) + '%';
            }, 50);
        }

        // ==========================================
        // 9. TAP THE BEAT RHYTHM
        // ==========================================
        function initRhythm(container) {
            container.innerHTML = `
                <div class="flex flex-col h-full space-y-4">
                    <div class="flex justify-between items-center bg-cardBg p-3 rounded-2xl border border-slate-800">
                        <div><div class="text-[10px] font-bold text-slate-400">SCORE</div><div id="r-score" class="text-xl font-black text-rose-400">0</div></div>
                        <div class="text-right"><div class="text-[10px] font-bold text-slate-400">BEST</div><div class="text-xl font-black text-slate-200">${getHighScore('rhythm')}</div></div>
                    </div>
                    <div class="my-auto bg-cardBg p-8 rounded-3xl border border-slate-800 text-center space-y-6 shadow-xl relative overflow-hidden">
                        <div class="text-xs uppercase tracking-wider text-slate-400">Tap when pulse is centered</div>
                        <div class="w-24 h-24 mx-auto rounded-full bg-rose-500/20 border-2 border-rose-500 flex items-center justify-center relative">
                            <div id="r-pulse" class="w-12 h-12 rounded-full bg-rose-500 animate-ping absolute"></div>
                            <div class="w-8 h-8 rounded-full bg-rose-600 relative z-10"></div>
                        </div>
                    </div>
                    <button onclick="handleBeatTap()" class="w-full py-5 bg-gradient-to-r from-rose-500 to-red-600 rounded-2xl font-extrabold text-white text-lg shadow-lg active:scale-95 transition">TAP BEAT</button>
                </div>
            `;

            let score = 0, beatPhase = 0, isOver = false;

            window.handleBeatTap = function() {
                if (isOver) return;
                // Check if pulse is in optimal window (approx phase 0.7 to 1.0)
                if (beatPhase > 0.65 && beatPhase < 1.05) {
                    AudioFX.play('score');
                    vibrate(30);
                    score++;
                    document.getElementById('r-score').textContent = score;
                } else {
                    gameOver("Missed the beat!");
                }
            };

            function gameOver(reason) {
                isOver = window.isGameOver = true;
                clearActiveGame();
                AudioFX.play('error');
                vibrate(100);
                const isNew = setHighScore('rhythm', score);
                container.innerHTML = `
                    <div class="my-auto text-center space-y-4 bg-cardBg p-6 rounded-3xl border border-slate-800 shadow-xl">
                        <div class="text-4xl">🎵</div>
                        <h2 class="text-xl font-extrabold text-white">GAME OVER</h2>
                        <p class="text-xs text-slate-400">${reason}</p>
                        <div class="bg-slate-900/60 p-3 rounded-2xl"><div class="text-xs text-slate-500">Score</div><div class="text-2xl font-black text-rose-400">${score}</div></div>
                        ${isNew ? '<div class="text-xs font-bold text-amber-400 animate-pulse">🎉 NEW PERSONAL BEST!</div>' : ''}
                        <button onclick="launchGame('rhythm')" class="w-full py-3 bg-gradient-to-r from-rose-500 to-red-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition">PLAY AGAIN</button>
                    </div>
                `;
            }

            currentGameInterval = setInterval(() => {
                if (isOver) return;
                beatPhase += 0.04;
                if (beatPhase > 1.2) beatPhase = 0;
            }, 50);
        }

        // ==========================================
        // 10. CYBER SNAKE MINI
        // ==========================================
        function initSnake(container) {
            container.innerHTML = `
                <div class="flex flex-col h-full space-y-3">
                    <div class="flex justify-between items-center bg-cardBg p-3 rounded-2xl border border-slate-800">
                        <div><div class="text-[10px] font-bold text-slate-400">SCORE</div><div id="s-score" class="text-xl font-black text-emerald-400">0</div></div>
                        <div class="text-right"><div class="text-[10px] font-bold text-slate-400">BEST</div><div class="text-xl font-black text-slate-200">${getHighScore('snake')}</div></div>
                    </div>
                    <div class="relative w-full aspect-square bg-slate-950 rounded-3xl border border-slate-800 overflow-hidden">
                        <canvas id="snake-canvas" class="w-full h-full block"></canvas>
                    </div>
                    <div class="grid grid-cols-3 gap-2 pb-2">
                        <div></div>
                        <button onclick="setSnakeDir(0, -1)" class="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-white shadow active:scale-95 transition">⬆️</button>
                        <div></div>
                        <button onclick="setSnakeDir(-1, 0)" class="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-white shadow active:scale-95 transition">⬅️</button>
                        <button onclick="setSnakeDir(0, 1)" class="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-white shadow active:scale-95 transition">⬇️</button>
                        <button onclick="setSnakeDir(1, 0)" class="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-white shadow active:scale-95 transition">➡️</button>
                    </div>
                </div>
            `;

            const canvas = document.getElementById('snake-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 300; canvas.height = 300;
            const gridSize = 15;
            const tileCount = canvas.width / gridSize;

            let score = 0, isOver = false;
            let snake = [{ x: 10, y: 10 }, { x: 10, y: 11 }, { x: 10, y: 12 }];
            let dx = 0, dy = -1;
            let food = { x: 5, y: 5 };

            function spawnFood() {
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            }

            window.setSnakeDir = function(nx, ny) {
                if ((nx === 1 && dx === -1) || (nx === -1 && dx === 1) || (ny === 1 && dy === -1) || (ny === -1 && dy === 1)) return;
                dx = nx; dy = ny;
            };

            // Keyboard support
            currentGameListener = (e) => {
                if (e.key === 'ArrowUp') setSnakeDir(0, -1);
                if (e.key === 'ArrowDown') setSnakeDir(0, 1);
                if (e.key === 'ArrowLeft') setSnakeDir(-1, 0);
                if (e.key === 'ArrowRight') setSnakeDir(1, 0);
            };
            window.addEventListener('keydown', currentGameListener);

            spawnFood();

            currentGameInterval = setInterval(() => {
                if (isOver) return;

                const head = { x: snake[0].x + dx, y: snake[0].y + dy };

                // Wall collision
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    gameOver("Hit boundary wall!");
                    return;
                }

                // Self collision
                for (let i = 0; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        gameOver("Hit your own tail!");
                        return;
                    }
                }

                snake.unshift(head);

                // Food check
                if (head.x === food.x && head.y === food.y) {
                    score++;
                    document.getElementById('s-score').textContent = score;
                    AudioFX.play('score');
                    vibrate(30);
                    spawnFood();
                } else {
                    snake.pop();
                }

                // Render Canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Food
                ctx.fillStyle = '#ec4899';
                ctx.shadowColor = '#ec4899'; ctx.shadowBlur = 10;
                ctx.fillRect(food.x * gridSize + 1, food.y * gridSize + 1, gridSize - 2, gridSize - 2);
                ctx.shadowBlur = 0;

                // Draw Snake
                ctx.fillStyle = '#10b981';
                snake.forEach((s, idx) => {
                    ctx.shadowColor = '#10b981'; ctx.shadowBlur = idx === 0 ? 10 : 0;
                    ctx.fillRect(s.x * gridSize + 1, s.y * gridSize + 1, gridSize - 2, gridSize - 2);
                });
                ctx.shadowBlur = 0;

            }, 120);

            function gameOver(reason) {
                isOver = window.isGameOver = true;
                clearActiveGame();
                AudioFX.play('error');
                vibrate(100);
                const isNew = setHighScore('snake', score);
                container.innerHTML = `
                    <div class="my-auto text-center space-y-4 bg-cardBg p-6 rounded-3xl border border-slate-800 shadow-xl">
                        <div class="text-4xl">🐍</div>
                        <h2 class="text-xl font-extrabold text-white">GAME OVER</h2>
                        <p class="text-xs text-slate-400">${reason}</p>
                        <div class="bg-slate-900/60 p-3 rounded-2xl"><div class="text-xs text-slate-500">Score</div><div class="text-2xl font-black text-emerald-400">${score}</div></div>
                        ${isNew ? '<div class="text-xs font-bold text-amber-400 animate-pulse">🎉 NEW PERSONAL BEST!</div>' : ''}
                        <button onclick="launchGame('snake')" class="w-full py-3 bg-gradient-to-r from-emerald-400 to-cyan-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition">PLAY AGAIN</button>
                    </div>
                `;
            }
        }

        // Initialize Main Menu on load
        window.onload = function() {
            renderMenu();
        };
    </script>
</body>
</html>
