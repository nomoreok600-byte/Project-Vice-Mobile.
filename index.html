<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f2">
  <title>Tile Master — MRB Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-content">
      <div class="brand-icon" aria-hidden="true">▦</div>
      <h1>Tile Master</h1>
      <p>Quick mind. Quicker fingers.</p>
      <button id="startButton" class="primary">Start playing</button>
      <div class="studio">Made by MRB Studio</div>
    </div>
  </div>

  <main class="app">
    <header>
      <div>
        <strong class="site-title">Tile Master</strong>
        <div class="site-subtitle">Made by MRB Studio</div>
      </div>
      <button id="soundButton" class="small-button">Sound: On</button>
    </header>
    <section id="appContent"></section>
  </main>

  <dialog id="resultDialog">
    <h2 id="resultTitle">Game over</h2>
    <p id="resultMessage"></p>
    <button id="replayButton" class="primary">Play again</button>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
