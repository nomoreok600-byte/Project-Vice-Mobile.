<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f2">
<title>Tile Master — MRB Studio</title>

<style>
:root {
  color-scheme: light;
  --bg: #f5f6f2;
  --surface: #fff;
  --ink: #20241f;
  --muted: #7d847b;
  --line: #e5e8e2;
  --accent: #4d7059;
  --accent-soft: #e7efe8;
  --danger: #b84f4f;
  --gold: #bc9141;
  --radius: 18px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system,
    BlinkMacSystemFont, "Segoe UI", sans-serif;
  overscroll-behavior: none;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }

.app {
  width: min(100% - 28px, 760px);
  margin: auto;
  padding: max(16px, env(safe-area-inset-top)) 0
    max(22px, env(safe-area-inset-bottom));
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 23px;
}

.brand { display: flex; align-items: center; gap: 11px; }

.logo {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: var(--accent-soft);
  color: var(--accent);
}

.logo svg { width: 26px; height: 26px; }

h1 { margin: 0; font-size: 21px; letter-spacing: -.6px; }
.subtitle { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

.header-actions { display: flex; gap: 7px; }

.icon-btn, .back {
  min-height: 40px;
  padding: 8px 11px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  color: var(--muted);
  font-size: 12px;
}

.icon-btn svg, .back svg {
  width: 16px;
  height: 16px;
  vertical-align: -4px;
  margin-right: 4px;
}

.intro { margin: 0 0 15px; }
.intro h2 { margin: 0; font-size: 22px; letter-spacing: -.5px; }
.intro p { margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }

.game-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
}

.game-card {
  min-height: 91px;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 13px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: 0 3px 12px #24302208;
  animation: card-in .38s both;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}

.game-card:hover {
  transform: translateY(-2px);
  border-color: #cbd8ce;
  box-shadow: 0 8px 18px #24302210;
}
.game-card:active { transform: scale(.98); }
.game-icon {
  width: 43px;
  height: 43px;
  flex: 0 0 43px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--accent-soft);
  color: var(--accent);
}
.game-icon svg { width: 23px; height: 23px; }
.card-copy { min-width: 0; flex: 1; }
.card-copy strong { display: block; font-size: 13px; }
.card-copy small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
}
.best {
  color: var(--muted);
  font-size: 9px;
  text-align: right;
  white-space: nowrap;
}
.best strong { display: block; color: var(--accent); font-size: 15px; }

.game-screen {
  min-height: min(70vh, 720px);
  display: flex;
  flex-direction: column;
  animation: screen-in .28s ease-out both;
}
.game-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}
.game-head h2 { margin: 0; font-size: 20px; }
.game-head small { color: var(--muted); }

.prompt {
  min-height: 58px;
  display: grid;
  place-items: center;
  margin: 14px 0;
  text-align: center;
}
.prompt strong { font-size: 18px; }
.prompt small { display: block; margin-top: 4px; color: var(--muted); }

.info-row, .timer-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
}
.timer-row { margin: 12px 0 6px; }
.timer-row strong { color: var(--ink); }

.track {
  height: 6px;
  overflow: hidden;
  border-radius: 20px;
  background: #e7e9e4;
}
.fill {
  height: 100%;
  width: 100%;
  transform: scaleX(1);
  transform-origin: left;
  background: var(--accent);
}
.fill.ai { background: #9186a1; }
.fill.danger { background: var(--danger); }

.tiles {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  width: min(100%, 390px);
  margin: auto;
}
.tile {
  aspect-ratio: 1;
  min-width: 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--surface);
  font-size: clamp(28px, 9vw, 43px);
  font-weight: 750;
  transition: transform .12s, background .15s, border-color .15s;
}
.tile:active { transform: scale(.94); }
.tile.target, .tile.lit {
  background: var(--accent-soft);
  border-color: #b8cbbb;
  color: var(--accent);
}
.tile.wrong { background: #f8e9e7; border-color: #d7a39d; color: var(--danger); }

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 9px;
  margin-top: 16px;
}
.choice, .direction, .pad {
  min-height: 48px;
  padding: 11px 16px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
  font-weight: 700;
}
.choice { flex: 1; min-width: 95px; }
.direction { min-width: 54px; font-size: 20px; }
.pad-grid {
  width: min(100%, 360px);
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin: auto;
}
.pad { min-height: 100px; border-radius: 22px; }
.pad.active { outline: 3px solid var(--ink); transform: scale(.96); }

.canvas-wrap { width: min(100%, 420px); margin: auto; }
canvas {
  display: block;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: #fbfcfa;
  touch-action: none;
}
.type-input {
  width: 100%;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface);
  font-size: 20px;
  text-align: center;
  text-transform: uppercase;
}
.note { min-height: 20px; text-align: center; color: var(--muted); font-size: 12px; }

dialog {
  width: min(90vw, 370px);
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--surface);
  color: var(--ink);
  text-align: center;
  box-shadow: 0 20px 70px #18201822;
}
dialog::backdrop { background: #18201870; }
dialog h2 { margin: 0 0 8px; }
dialog p { color: var(--muted); font-size: 13px; line-height: 1.5; }
.primary {
  width: 100%;
  min-height: 49px;
  border: 0;
  border-radius: 14px;
  background: var(--accent);
  color: white;
  font-weight: 750;
}
button:focus-visible, input:focus-visible {
  outline: 3px solid #84a88d;
  outline-offset: 2px;
}

/* Splash screen */
.splash {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 24px;
  background:
    radial-gradient(ellipse at 50% 38%, #e3ece4 0%, transparent 47%),
    var(--bg);
  transition: opacity .4s ease, visibility .4s ease;
}
.splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

.splash::before, .splash::after {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  border: 1px solid #78917c20;
  border-radius: 50%;
  animation: orbit 18s linear infinite;
}
.splash::after {
  width: 320px;
  height: 320px;
  animation-direction: reverse;
}

.splash-inner { position: relative; z-index: 1; width: min(100%, 390px); text-align: center; }
.splash-mark {
  width: 94px;
  height: 94px;
  display: grid;
  place-items: center;
  margin: 0 auto 22px;
  border-radius: 30px;
  background: var(--surface);
  color: var(--accent);
  box-shadow: 0 15px 40px #344d3917;
  animation: mark-float 2.8s ease-in-out infinite;
}
.splash-mark svg { width: 52px; height: 52px; }
.splash-title {
  margin: 0;
  font-size: clamp(39px, 11vw, 57px);
  letter-spacing: -3px;
  animation: title-in .65s both;
}
.splash-tag { margin: 9px 0 30px; color: var(--muted); font-size: 14px; }
.studio {
  margin-top: 20px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
}
.splash-version { margin-top: 14px; color: #a1a59d; font-size: 11px; }

@keyframes card-in {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes screen-in {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes mark-float {
  0%,100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-6px) rotate(2deg); }
}
@keyframes title-in {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes orbit { to { transform: rotate(360deg); } }

@media(max-width:410px) {
  .app { width: min(100% - 22px, 760px); }
  .game-list { gap: 8px; }
  .game-card { min-height: 84px; padding: 10px; gap: 8px; }
  .game-icon { width: 37px; height: 37px; flex-basis: 37px; }
  .best { display: none; }
}
@media(max-height:680px) {
  .app { padding-top: 10px; }
  header { margin-bottom: 13px; }
  .game-screen { min-height: 75vh; }
  .prompt { margin: 8px 0; }
  .tiles { gap: 6px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<div id="splash" class="splash">
  <div class="splash-inner">
    <div class="splash-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="7" height="7" rx="2"/>
        <rect x="14" y="3" width="7" height="7" rx="2"/>
        <rect x="3" y="14" width="7" height="7" rx="2"/>
        <path d="M17.5 14v7M14 17.5h7"/>
      </svg>
    </div>
    <h1 class="splash-title">Tile Master</h1>
    <p class="splash-tag">Quick mind. Quicker fingers.</p>
    <button id="startButton" class="primary">Start playing</button>
    <div class="studio">Made by MRB Studio</div>
    <div class="splash-version">10 quick games · Personal bests saved on device</div>
  </div>
</div>

<main class="app">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7" rx="2"/>
          <rect x="14" y="3" width="7" height="7" rx="2"/>
          <rect x="3" y="14" width="7" height="7" rx="2"/>
          <path d="M17.5 14v7M14 17.5h7"/>
        </svg>
      </div>
      <div><h1>Tile Master</h1><p class="subtitle">Made by MRB Studio</p></div>
    </div>
    <div class="header-actions">
      <button id="soundButton" class="icon-btn" aria-label="Toggle sound">♪ Sound on</button>
    </div>
  </header>
  <section id="app" aria-live="polite"></section>
</main>

<dialog id="resultDialog">
  <h2 id="resultTitle">Game over</h2>
  <p id="resultText"></p>
  <button id="replayButton" class="primary">Play again</button>
</dialog>

<script>
"use strict";

const $ = id => document.getElementById(id);
const app = $("app");
const STORAGE_KEY = "tile-master-mrb-highscores-v1";

const ICONS = {
  bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m13 2-9 12h7l-1 8 10-13h-7z"/></svg>',
  pong:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4v16M19 4v16M12 11h.01"/></svg>',
  color:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l8 4"/></svg>',
  brain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4a4 4 0 0 0-7 3 4 4 0 0 0 0 7 4 4 0 0 0 7 4m0-14a4 4 0 0 1 7 3 4 4 0 0 1 0 7 4 4 0 0 1-7 4M12 4v16"/></svg>',
  math:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5h14M12 2v6M6 13l4 4m0-4-4 4m8-1h5"/></svg>',
  arrows:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 19V5m0 0L6 11m6-6 6 6"/></svg>',
  coin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M15 8.5c-.7-.7-1.7-1-3-1-1.7 0-3 .8-3 2s1 1.8 3 2 3 .8 3 2-1.3 2-3 2c-1.3 0-2.3-.4-3-1m3-8v11"/></svg>',
  word:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 5h18M12 5v14M7 19h10"/></svg>',
  rhythm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>',
  snake:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h9a3 3 0 1 1-3 3v4a3 3 0 1 0 3-3h7"/><circle cx="18" cy="11" r="1"/></svg>'
};

const GAMES = [
  {id:"gridtap", title:"Grid Tap Blitz", desc:"Tap the target before the AI rival.", icon:"bolt"},
  {id:"pong", title:"Pong Solo", desc:"Keep the ball in play against the AI.", icon:"pong"},
  {id:"colorswitch", title:"Color Switch", desc:"Find the called-out color.", icon:"color"},
  {id:"memory", title:"Simon Says", desc:"Watch and repeat the sequence.", icon:"brain"},
  {id:"math", title:"Math Blitz", desc:"Answer quick true-or-false equations.", icon:"math"},
  {id:"direction", title:"Direction Dash", desc:"Follow the arrow before time runs out.", icon:"arrows"},
  {id:"coin", title:"Coin Catch", desc:"Catch coins and avoid hazards.", icon:"coin"},
  {id:"word", title:"Word Rush", desc:"Type words faster than the rival.", icon:"word"},
  {id:"beat", title:"Beat Tap", desc:"Tap when the moving pulse is centered.", icon:"rhythm"},
  {id:"snake", title:"Classic Snake", desc:"Eat, grow, and avoid your tail.", icon:"snake"}
];

let soundEnabled = true;
let audioContext = null;
let activeGame = null;
let cleanupTasks = [];
let animationFrame = 0;
let currentGameId = null;
let runId = 0;

function readScores() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    return data && typeof data === "object" ? data : {};
  } catch {
    return {};
  }
}

function highScore(id) {
  const value = Number(readScores()[id] || 0);
  return Number.isFinite(value) ? Math.max(0, value) : 0;
}

function saveScore(id, score) {
  const scores = readScores();
  const old = Number(scores[id] || 0);
  if (score <= old) return false;

  scores[id] = score;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(scores)); } catch {}
  return true;
}

function addCleanup(fn) { cleanupTasks.push(fn); }

function later(fn, ms) {
  const timer = setTimeout(fn, ms);
  addCleanup(() => clearTimeout(timer));
  return timer;
}

function listen(target, type, fn, options) {
  target.addEventListener(type, fn, options);
  addCleanup(() => target.removeEventListener(type, fn, options));
}

function stopGame() {
  cancelAnimationFrame(animationFrame);
  animationFrame = 0;
  cleanupTasks.forEach(fn => { try { fn(); } catch {} });
  cleanupTasks = [];
  activeGame = null;
}

function sound(type = "tap") {
  if (!soundEnabled) return;

  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!Audio) return;
    if (!audioContext) audioContext = new Audio();
    if (audioContext.state === "suspended") audioContext.resume().catch(() => {});

    const presets = {
      tap: [450, 650, .07, "sine"],
      score: [520, 780, .16, "triangle"],
      error: [180, 90, .18, "sawtooth"],
      win: [440, 660, .25, "sine"]
    };
    const [from, to, duration, wave] = presets[type] || presets.tap;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const now = audioContext.currentTime;

    osc.type = wave;
    osc.frequency.setValueAtTime(from, now);
    osc.frequency.exponentialRampToValueAtTime(to, now + duration);
    gain.gain.setValueAtTime(.09, now);
    gain.gain.exponentialRampToValueAtTime(.001, now + duration);
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(now);
    osc.stop(now + duration);
    osc.onended = () => { osc.disconnect(); gain.disconnect(); };
  } catch {}
}

function buzz(pattern = 20) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch {}
}

function drawHeader(title, score = 0, rival = null) {
  return `<div class="game-head">
    <div>
      <h2>${title}</h2>
      <small>Score <b id="gameScore">${score}</b>
      ${rival === null ? "" : ` · Rival <b id="rivalScore">${rival}</b>`}</small>
    </div>
    <button class="back" data-menu>← Games</button>
  </div>`;
}

function renderMenu() {
  stopGame();
  currentGameId = null;
  $("resultDialog").close();

  app.innerHTML = `
    <div class="intro">
      <h2>Choose a game</h2>
      <p>Ten quick challenges. Your best scores are saved on this device.</p>
    </div>
    <div class="game-list">
      ${GAMES.map((game, index) => `
        <button class="game-card" data-game="${game.id}" style="animation-delay:${index * 28}ms">
          <span class="game-icon">${ICONS[game.icon]}</span>
          <span class="card-copy"><strong>${game.title}</strong><small>${game.desc}</small></span>
          <span class="best">BEST<strong>${highScore(game.id)}</strong></span>
        </button>`).join("")}
    </div>`;

  updateSoundButton();
}

function updateSoundButton() {
  $("soundButton").innerHTML = `${ICONS.rhythm} Sound ${soundEnabled ? "on" : "off"}`;
}

function beginGame(id) {
  stopGame();
  runId++;
  currentGameId = id;
  activeGame = { id, score: 0, over: false };
  $("resultDialog").close();
  return activeGame;
}

function endGame(message, score) {
  if (!activeGame || activeGame.over) return;

  activeGame.over = true;
  cancelAnimationFrame(animationFrame);
  const finishedRun = runId;
  const record = saveScore(currentGameId, score);

  sound("error");
  buzz([75, 40, 90]);

  $("resultTitle").textContent = record ? "New personal best!" : "Game over";
  $("resultText").textContent =
    `${message} Score: ${score}. Best: ${highScore(currentGameId)}.`;

  $("resultDialog").showModal();
  $("replayButton").onclick = () => {
    $("resultDialog").close();
    if (finishedRun === runId && currentGameId) launchGame(currentGameId);
  };
}

function launchGame(id) {
  const game = GAMES.find(item => item.id === id);
  if (!game) return;

  const state = beginGame(id);

  switch (id) {
    case "gridtap": gameGridTap(state); break;
    case "pong": gamePong(state); break;
    case "colorswitch": gameColorSwitch(state); break;
    case "memory": gameMemory(state); break;
    case "math": gameMath(state); break;
    case "direction": gameDirection(state); break;
    case "coin": gameCoinCatch(state); break;
    case "word": gameWordRush(state); break;
    case "beat": gameBeatTap(state); break;
    case "snake": gameSnake(state); break;
  }
}

document.addEventListener("click", event => {
  const gameButton = event.target.closest("[data-game]");
  if (gameButton) launchGame(gameButton.dataset.game);
  if (event.target.closest("[data-menu]")) renderMenu();
});

$("soundButton").addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  updateSoundButton();
  if (soundEnabled) sound("tap");
});

$("startButton").addEventListener("click", () => {
  $("splash").classList.add("hidden");
  renderMenu();
});

$("resultDialog").addEventListener("cancel", event => event.preventDefault());

function randomInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

/* 1. Grid Tap Blitz: rival becomes faster as your score grows. */
function gameGridTap(g) {
  let target = -1;
  let time = 5;
  let rival = 0;
  let rivalProgress = 0;
  let previousTime = 0;

  const rivalInterval = () => Math.max(.22, .55 - g.score * .003);

  app.innerHTML = `<div class="game-screen">
    ${drawHeader("Grid Tap Blitz", 0, 0)}
    <div class="timer-row"><span>Time · correct taps add 0.35s</span><strong id="timeText">5.00s</strong></div>
    <div class="track"><div id="timeBar" class="fill"></div></div>
    <div class="timer-row"><span>AI rival · <b id="rivalSpeed"></b></span><span>Progress</span></div>
    <div class="track"><div id="aiBar" class="fill ai"></div></div>
    <div class="prompt"><div><strong>Tap the ◆ target</strong><small>A wrong tile ends the round</small></div></div>
    <div class="tiles" id="tapBoard"></div>
  </div>`;

  const board = $("tapBoard");
  for (let i = 0; i < 9; i++) {
    const button = document.createElement("button");
    button.className = "tile";
    button.dataset.index = String(i);
    button.setAttribute("aria-label", `Tile ${i + 1}`);
    board.appendChild(button);
  }

  function newRound() {
    const buttons = [...board.children];
    buttons.forEach(button => {
      button.className = "tile";
      button.textContent = "";
    });
    target = randomInt(0, buttons.length - 1);
    buttons[target].classList.add("target");
    buttons[target].textContent = "◆";
  }

  board.addEventListener("click", event => {
    const button = event.target.closest(".tile");

      endGame(`Wrong tile. The rival scored ${rival}.`, g.score);
      return;
    }

    g.score++;
    $("gameScore").textContent = g.score;
    time = Math.min(8, time + .35);
    sound("score");
    buzz(18);
    newRound();
  });

  newRound();

  function frame(now) {
    if (g.over) return;

    const dt = Math.min(.05, Math.max(0, (now - previousTime) / 1000));
    previousTime = now;
    time -= dt;
    rivalProgress += dt / rivalInterval();

    if (rivalProgress >= 1) {
      const earned = Math.floor(rivalProgress);
      rival += earned;
      rivalProgress -= earned;
      $("rivalScore").textContent = rival;
    }

    $("rivalSpeed").textContent = `${rivalInterval().toFixed(2)}s / point`;
    $("timeText").textContent = `${Math.max(0, time).toFixed(2)}s`;
    $("timeBar").style.transform = `scaleX(${clamp(time / 8, 0, 1)})`;
    $("aiBar").style.transform = `scaleX(${clamp(rivalProgress, 0, 1)})`;

    if (time <= 0) {
      endGame(`Time ran out. The rival scored ${rival}.`, g.score);
      return;
    }

    animationFrame = requestAnimationFrame(frame);
  }
  animationFrame = requestAnimationFrame(frame);
}

/* 2. Pong: finger or mouse movement controls the left paddle. */
function gamePong(g) {
  app.innerHTML = `<div class="game-screen">
    ${drawHeader("Pong Solo", 0, 0)}
    <p class="note">Move your finger on the court to move your paddle.</p>
    <div class="canvas-wrap"><canvas id="pongCanvas" width="360" height="500"></canvas></div>
    <div class="controls">
      <button class="direction" data-paddle="-1">◀</button>
      <button class="direction" data-paddle="1">▶</button>
    </div>
    <p class="note">First to 5 points wins.</p>
  </div>`;

  const canvas = $("pongCanvas");
  const ctx = canvas.getContext("2d");
  let playerY = 215, aiY = 215;
  let x = 180, y = 250, vx = 3, vy = 2;
  let playerScore = 0, aiScore = 0, held = 0;

  function movePaddle(event) {
    const rect = canvas.getBoundingClientRect();
    playerY = clamp((event.clientY - rect.top) * canvas.height / rect.height - 34, 0, 432);
  }

  canvas.addEventListener("pointerdown", event => {
    canvas.setPointerCapture(event.pointerId);
    movePaddle(event);
  });
  canvas.addEventListener("pointermove", event => {
    if (event.buttons || event.pointerType === "touch") movePaddle(event);
  });

  document.querySelectorAll("[data-paddle]").forEach(button => {
    const set = () => { held = Number(button.dataset.paddle); };
    const clear = () => { held = 0; };
    button.addEventListener("pointerdown", set);
    button.addEventListener("pointerup", clear);
    button.addEventListener("pointercancel", clear);
    addCleanup(() => {
      button.removeEventListener("pointerdown", set);
      button.removeEventListener("pointerup", clear);
      button.removeEventListener("pointercancel", clear);
    });
  });

  function resetBall(direction) {
    x = 180; y = 250;
    vx = direction * 3;
    vy = (Math.random() - .5) * 4;
  }

  function draw() {
    if (g.over) return;

    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#fbfcfa";
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = "#dce1da";
    ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke();
    ctx.setLineDash([]);

    playerY = clamp(playerY + held * 5, 0, h - 68);

    // AI tracks the ball with increasing accuracy as the rally continues.
    const accuracy = clamp(.42 + g.score * .035, .42, .9);
    aiY = clamp(aiY + (y - 34 - aiY) * accuracy, 0, h - 68);

    ctx.fillStyle = "#4d7059";
    ctx.fillRect(12, playerY, 9, 68);
    ctx.fillRect(w - 21, aiY, 9, 68);

    ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill();

    x += vx; y += vy;
    if (y < 8 || y > h - 8) vy *= -1;

    if (vx < 0 && x < 28 && y >= playerY - 6 && y <= playerY + 74) {
      vx = Math.abs(vx) * 1.035;
      vy += (y - playerY - 34) * .045;
    }
    if (vx > 0 && x > w - 28 && y >= aiY - 6 && y <= aiY + 74) {
      vx = -Math.abs(vx) * 1.035;
      vy += (y - aiY - 34) * .025;
    }

    if (x < -8) {
      aiScore++;
      $("rivalScore").textContent = aiScore;
      resetBall(1);
    } else if (x > w + 8) {
      playerScore++;
      g.score = playerScore;
      $("gameScore").textContent = playerScore;
      sound("score");
      resetBall(-1);
    }

    if (playerScore >= 5 || aiScore >= 5) {
      endGame(playerScore > aiScore ? "You won the rally!" : "The rival won the rally.", playerScore);
      return;
    }

    animationFrame = requestAnimationFrame(draw);
  }

  animationFrame = requestAnimationFrame(draw);
}

/* 4. Simon Says memory sequence. */
function gameMemory(g) {
  let sequence = [];
  let inputIndex = 0;
  let roundNumber = 1;
  let locked = true;

  app.innerHTML = `<div class="game-screen">
    ${drawHeader("Simon Says")}
    <div class="prompt"><div><strong id="memoryPrompt">Watch the sequence</strong><small>Repeat the lights in order</small></div></div>
    <div class="pad-grid">
      <button class="pad" data-pad="0" style="background:#dcebe0">●</button>
      <button class="pad" data-pad="1" style="background:#e8e1f0">◆</button>
      <button class="pad" data-pad="2" style="background:#f1e3df">■</button>
      <button class="pad" data-pad="3" style="background:#e4eaf1">▲</button>
    </div>
    <p class="note">Complete each round to increase your score.</p>
  </div>`;

  const pads = [...document.querySelectorAll("[data-pad]")];

  function flash(index) {
    const pad = pads[index];
    if (!pad) return;
    pad.classList.add("active");
    sound("tap");
    later(() => pad.classList.remove("active"), 240);
  }

  function showSequence() {
    if (g.over) return;
    locked = true;
    inputIndex = 0;
    sequence.push(randomInt(0, 3));
    $("memoryPrompt").textContent = `Round ${roundNumber} · Watch`;
    const delay = Math.max(300, 650 - roundNumber * 12);

    sequence.forEach((index, i) => {
      later(() => flash(index), 400 + i * delay);
    });

    later(() => {
      if (g.over) return;
      locked = false;
      $("memoryPrompt").textContent = `Round ${roundNumber} · Your turn`;
    }, 400 + sequence.length * delay);
  }

  pads.forEach(pad => pad.addEventListener("click", () => {
    if (locked || g.over) return;
    const pressed = Number(pad.dataset.pad);
    flash(pressed);

    if (pressed !== sequence[inputIndex]) {
      endGame("The sequence was incorrect.", g.score);
      return;
    }

    inputIndex++;
    if (inputIndex === sequence.length) {
      g.score += roundNumber;
      $("gameScore").textContent = g.score;
      roundNumber++;
      sound("score");
      later(showSequence, 450);
    }
  }));

  showSequence();
}

/* 7. Coin Catch. */
function gameCoinCatch(g) {
  const W = 360, H = 500;
  let basketX = W / 2, objects = [], previous = 0, elapsed = 0, spawnTime = 0;

  app.innerHTML = `<div class="game-screen">
    ${drawHeader("Coin Catch")}
    <p class="note">Drag on the playfield to move. Catch gold; avoid red hazards.</p>
    <div class="canvas-wrap"><canvas id="coinCanvas" width="${W}" height="${H}"></canvas></div>
    <p class="note">Survive for 30 seconds.</p>
  </div>`;

  const canvas = $("coinCanvas");
  const ctx = canvas.getContext("2d");

  function moveBasket(event) {
    const rect = canvas.getBoundingClientRect();
    basketX = clamp((event.clientX - rect.left) * W / rect.width, 25, W - 25);
  }

  canvas.addEventListener("pointerdown", event => {
    canvas.setPointerCapture(event.pointerId);
    moveBasket(event);
  });
  canvas.addEventListener("pointermove", event => {
    if (event.buttons || event.pointerType === "touch") moveBasket(event);
  });

  function frame(now) {
    if (g.over) return;
    const dt = Math.min(.05, Math.max(0, (now - previous) / 1000));
    previous = now;
    elapsed += dt;
    spawnTime += dt;

    if (spawnTime > .58) {
      spawnTime = 0;
      objects.push({
        x: randomInt(14, W - 14),
        y: -12,
        hazard: Math.random() < .23,
        speed: 155 + Math.min(160, g.score * 4)
      });
    }

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "#f8faf7";
    ctx.fillRect(0, 0, W, H);

    for (const object of objects) {
      object.y += object.speed * dt;
      ctx.fillStyle = object.hazard ? "#b84f4f" : "#bc9141";
      ctx.beginPath();
      ctx.arc(object.x, object.y, 10, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "#4d7059";
    ctx.beginPath();
    ctx.roundRect(basketX - 29, H - 39, 58, 13, 6);
    ctx.fill();

    for (let i = objects.length - 1; i >= 0; i--) {
      const object = objects[i];
      if (object.y > H - 54 && Math.abs(object.x - basketX) < 39) {
        if (object.hazard) { endGame("You caught a hazard.", g.score); return; }
        g.score++;
        $("gameScore").textContent = g.score;
        sound("score");
        objects.splice(i, 1);
      } else if (object.y > H + 12) {
        objects.splice(i, 1);
      }
    }

    if (elapsed >= 30) { endGame("Round complete!", g.score); return; }
    animationFrame = requestAnimationFrame(frame);
  }

  animationFrame = requestAnimationFrame(frame);
}

/* 10. Snake. */
function gameSnake(g) {
  const size = 18, canvasSize = 360, cell = canvasSize / size;
  let snake = [{x:8,y:9},{x:7,y:9},{x:6,y:9}];
  let direction = {x:1,y:0}, pending = {x:1,y:0};
  let food = {x:13,y:8}, previous = 0, accumulator = 0;

  app.innerHTML = `<div class="game-screen">
    ${drawHeader("Classic Snake")}
    <p class="note">Use the arrow buttons or keyboard arrow keys.</p>
    <div class="canvas-wrap"><canvas id="snakeCanvas" width="${canvasSize}" height="${canvasSize}"></canvas></div>
    <div class="controls">
      <button class="direction" data-dir="up" aria-label="Up">↑</button>
      <button class="direction" data-dir="left" aria-label="Left">←</button>
      <button class="direction" data-dir="down" aria-label="Down">↓</button>
      <button class="direction" data-dir="right" aria-label="Right">→</button>
    </div>
  </div>`;

  const canvas = $("snakeCanvas");
  const ctx = canvas.getContext("2d");

  function setDirection(x, y) {
    if (x === -direction.x && y === -direction.y) return;
    pending = {x, y};
  }

  const keyHandler = event => {
    const map = {
      ArrowUp:[0,-1], ArrowDown:[0,1],
      ArrowLeft:[-1,0], ArrowRight:[1,0]
    };
    if (map[event.key]) {
      event.preventDefault();
      setDirection(map[event.key][0], map[event.key][1]);
    }
  };
  window.addEventListener("keydown", keyHandler);
  addCleanup(() => window.removeEventListener("keydown", keyHandler));

  document.querySelectorAll("[data-dir]").forEach(button => {
    button.addEventListener("click", () => {
      const dir = button.dataset.dir;
      setDirection(
        dir === "left" ? -1 : dir === "right" ? 1 : 0,
        dir === "up" ? -1 : dir === "down" ? 1 : 0
      );
    });
  });

  function placeFood() {
    let attempts = 0;
    do {
      food = {x:randomInt(0,size-1), y:randomInt(0,size-1)};
      attempts++;
    } while (snake.some(part => part.x === food.x && part.y === food.y) && attempts < 400);
  }

  function frame(now) {
    if (g.over) return;
    const dt = Math.min(.05, Math.max(0, (now - previous) / 1000));
    previous = now;
    accumulator += dt;
    const step = Math.max(.075, .15 - g.score * .0015);

    while (accumulator >= step) {
      accumulator -= step;
      direction = pending;

      const head = {x:snake[0].x + direction.x, y:snake[0].y + direction.y};
      const eating = head.x === food.x && head.y === food.y;
      const bodyToCheck = eating ? snake : snake.slice(0, -1);

      if (
        head.x < 0 || head.x >= size || head.y < 0 || head.y >= size ||
        bodyToCheck.some(part => part.x === head.x && part.y === head.y)
      ) {
        endGame("Snake crashed.", g.score);
        return;
      }

      snake.unshift(head);

      if (eating) {
        g.score++;
        $("gameScore").textContent = g.score;
        sound("score");
        placeFood();
      } else {
        snake.pop();
      }
    }

    ctx.clearRect(0, 0, canvasSize, canvasSize);
    ctx.fillStyle = "#fbfcfa";
    ctx.fillRect(0, 0, canvasSize, canvasSize);

    ctx.fillStyle = "#bc9141";
    ctx.beginPath();
    ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * .32, 0, Math.PI * 2);
    ctx.fill();

    snake.forEach((part, index) => {
      ctx.fillStyle = index === 0 ? "#4d7059" : "#9bad9e";
      ctx.beginPath();
      ctx.roundRect(part.x * cell + 2, part.y * cell + 2, cell - 4, cell - 4, 4);
      ctx.fill();
    });

    animationFrame = requestAnimationFrame(frame);
  }

  animationFrame = requestAnimationFrame(frame);
}

/* Open the splash first; the player taps Start to enter the menu. */
$("splash").classList.remove("hidden");
</script>
