<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#0b1020">
  <title>Grid Tap: 5-Second Blitz</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #0b1020;
      --panel: #141d34;
      --tile: #203354;
      --text: #f2f6ff;
      --muted: #a3b2ce;
      --green: #91ff70;
      --purple: #bd96ff;
      --red: #ff647c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at top, #223259 0%, transparent 65%),
        var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      overscroll-behavior: none;
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    .game {
      width: min(100%, 440px);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 6vw, 30px);
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .best {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .best strong {
      display: block;
      color: var(--text);
      font-size: 24px;
      font-variant-numeric: tabular-nums;
    }

    .scores {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .score-card {
      padding: 12px 16px;
      border: 1px solid #ffffff14;
      border-radius: 16px;
      background: var(--panel);
    }

    .score-card span {
      color: var(--muted);
      font-size: 12px;
    }

    .score-card strong {
      display: block;
      font-size: 36px;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    #score {
      color: var(--green);
    }

    #ghostScore {
      color: var(--purple);
    }

    .timer-label,
    .ghost-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 13px;
    }

    #time {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    #bonus {
      display: inline-block;
      margin-left: 6px;
      color: var(--green);
      opacity: 0;
      font-size: 13px;
    }

    #bonus.pop {
      animation: bonus-pop 350ms ease-out;
    }

    .track {
      height: 9px;
      overflow: hidden;
      border-radius: 20px;
      background: #ffffff12;
    }

    .fill {
      height: 100%;
      width: 100%;
      transform-origin: left;
      transform: scaleX(1);
      border-radius: inherit;
      background: var(--green);
      will-change: transform;
    }

    #timerPanel.urgent #time {
      color: var(--red);
    }

    #timerPanel.urgent .fill {
      background: var(--red);
    }

    .ghost-panel {
      margin-top: 14px;
    }

    .ghost-label {
      color: var(--muted);
      font-size: 12px;
    }

    #ghostFill {
      background: var(--purple);
      transform: scaleX(0);
    }

    #raceStatus {
      margin: 12px 0 0;
      text-align: center;
      font-weight: 600;
      font-size: 13px;
      color: var(--purple);
      min-height: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0;
      padding: 5px;
      border-radius: 20px;
      user-select: none;
      -webkit-user-select: none;
    }

    .tile {
      display: grid;
      place-items: center;
      aspect-ratio: 1;
      width: 100%;
      padding: 0;
      border: 1px solid #ffffff10;
      border-radius: 18px;
      background: var(--tile);
      color: transparent;
      cursor: pointer;
      font-size: clamp(30px, 11vw, 52px);
      box-shadow: inset 0 -5px 0 #00000020;
      touch-action: none;
    }

    .tile.target {
      background: var(--green);
      color: #143a20;
      border-color: #c4ffb2;
      box-shadow:
        inset 0 -5px 0 #00000015,
        0 0 20px #91ff7025;
    }

    .tile.tapped {
      animation: tile-tap 130ms ease-out;
    }

    .tile:focus-visible,
    .primary:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    .grid.failed {
      animation: grid-fail 420ms ease-out;
    }

    .grid.failed .tile {
      background: #65273a;
      border-color: var(--red);
      color: var(--red);
    }

    .instructions {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .instructions strong {
      color: var(--green);
    }

    dialog {
      width: min(90vw, 380px);
      padding: 28px;
      border: 1px solid #ffffff26;
      border-radius: 24px;
      background: #141d34;
      color: var(--text);
      text-align: center;
      box-shadow: 0 24px 90px #00000080;
    }

    dialog::backdrop {
      background: #030711bb;
    }

    dialog h2 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    #endReason {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 24px 0 18px;
    }

    .results div {
      padding: 16px 8px;
      border-radius: 14px;
      background: #ffffff07;
    }

    .results span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .results strong {
      display: block;
      margin-top: 4px;
      font-size: 42px;
      font-variant-numeric: tabular-nums;
    }

    #finalScore {
      color: var(--green);
    }

    #finalGhostScore {
      color: var(--purple);
    }

    #verdict {
      font-weight: 700;
      font-size: 17px;
    }

    #runStats {
      color: var(--muted);
      font-size: 12px;
    }

    .primary {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: var(--green);
      color: #123120;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    @keyframes tile-tap {
      0% { transform: scale(1); }
      45% { transform: scale(.9); }
      100% { transform: scale(1); }
    }

    @keyframes bonus-pop {
      0% { opacity: 1; transform: translateY(5px); }
      60% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-9px); }
    }

    @keyframes grid-fail {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    @media (max-height: 720px) {
      .game { max-width: 350px; }
      header { margin-bottom: 10px; }
      .score-card { padding: 8px 14px; }
      .score-card strong { font-size: 30px; }
      .grid { margin: 10px 0; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <header>
      <div>
        <h1>Grid Tap</h1>
        <p class="subtitle">5-Second Blitz</p>
      </div>
      <div class="best">
        PERSONAL BEST
        <strong id="bestScore">0</strong>
      </div>
    </header>

    <section class="scores" aria-label="Current scores">
      <div class="score-card">
        <span>YOU</span>
        <strong id="score">0</strong>
      </div>

      <div class="score-card">
        <span>AI GHOST</span>
        <strong id="ghostScore">0</strong>
      </div>
    </section>

    <section id="timerPanel" aria-label="Time remaining">
      <div class="timer-label">
        <span>
          TIME LEFT
          <span id="bonus" aria-hidden="true">+0.5s</span>
        </span>
        <span id="time">5.00s</span>
      </div>

      <div class="track">
        <div id="timeFill" class="fill"></div>
      </div>
    </section>

    <section class="ghost-panel" aria-label="Ghost progress">
      <div class="ghost-label">
        <span>Ghost’s next tile</span>
        <span id="ghostSpeed">0.75s / tile</span>
      </div>

      <div class="track">
        <div id="ghostFill" class="fill"></div>
      </div>
    </section>

    <p id="raceStatus">Neck and neck!</p>

    <div id="grid" class="grid" role="group" aria-label="Tap the diamond tile">
      <!-- Nine buttons are created by JavaScript. -->
    </div>

    <p class="instructions">
      Tap the <strong>green ◆</strong> tile.
      Each correct tap adds <strong>0.5 seconds</strong>.<br>
      One wrong tap ends the run.
    </p>
  </main>

  <dialog id="gameOverDialog" aria-labelledby="endTitle">
    <h2 id="endTitle">Game Over</h2>
    <p id="endReason"></p>

    <div class="results">
      <div>
        <span>YOUR SCORE</span>
        <strong id="finalScore">0</strong>
      </div>
      <div>
        <span>AI GHOST</span>
        <strong id="finalGhostScore">0</strong>
      </div>
    </div>

    <p id="verdict"></p>
    <p id="runStats"></p>

    <button id="restart" class="primary">Play Again</button>
  </dialog>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);

    const SETTINGS = {
      startTime: 5,
      correctTapBonus: 0.5,
      initialGhostInterval: 0.75,
      minimumGhostInterval: 0.5,
      ghostAcceleration: 0.008,
      storageKey: "grid-tap-blitz-best-v1"
    };

    const grid = $("grid");
    const dialog = $("gameOverDialog");
    const tiles = [];

    let score = 0;
    let ghostScore = 0;
    let timeLeft = SETTINGS.startTime;
    let isGameOver = false;
    let targetIndex = -1;

    let startedAt = 0;
    let deadline = 0;
    let nextGhostAt = 0;
    let ghostInterval = SETTINGS.initialGhostInterval;

    let frameId = 0;
    let modalTimer = 0;
    let bestScore = readBestScore();

    // Block overlapping fingers so simultaneous presses cannot
    // accidentally clear several newly generated rounds.
    let activePointer = null;

    function readBestScore() {
      try {
        const value = Number(localStorage.getItem(SETTINGS.storageKey));
        return Number.isFinite(value) && value >= 0
          ? Math.floor(value)
          : 0;
      } catch {
        // Gameplay still works when storage is unavailable.
        return 0;
      }
    }

    function saveBestScore() {
      try {
        localStorage.setItem(SETTINGS.storageKey, String(bestScore));
      } catch {
        // Private browsing or storage restrictions must not stop play.
      }
    }

    function ghostSpeedForScore() {
      return Math.max(
        SETTINGS.minimumGhostInterval,
        SETTINGS.initialGhostInterval -
          score * SETTINGS.ghostAcceleration
      );
    }

    function createBoard() {
      for (let i = 0; i < 9; i++) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tile";
        button.dataset.index = String(i);
        button.setAttribute("aria-label", `Tile ${i + 1}`);

        button.addEventListener("animationend", () => {
          button.classList.remove("tapped");
        });

        tiles.push(button);
        grid.appendChild(button);
      }
    }

    function startRound() {
      const previous = targetIndex;

      if (previous >= 0) {
        tiles[previous].classList.remove("target");
        tiles[previous].textContent = "";
        tiles[previous].setAttribute(
          "aria-label",
          `Tile ${previous + 1}`
        );
      }

      // Pick any tile except the previous target.
      // This prevents holding one position from feeling like a shuffle.
      if (previous < 0) {
        targetIndex = Math.floor(Math.random() * 9);
      } else {
        targetIndex = Math.floor(Math.random() * 8);
        if (targetIndex >= previous) targetIndex++;
      }

      const target = tiles[targetIndex];
      target.classList.add("target");
      target.textContent = "◆";
      target.setAttribute(
        "aria-label",
        `Target diamond, tile ${targetIndex + 1}`
      );
    }

    function startGame() {
      cancelAnimationFrame(frameId);
      clearTimeout(modalTimer);

      if (dialog.open) dialog.close();

      score = 0;
      ghostScore = 0;
      timeLeft = SETTINGS.startTime;
      isGameOver = false;
      activePointer = null;
      targetIndex = -1;

      grid.classList.remove("failed");

      for (let i = 0; i < tiles.length; i++) {
        const tile = tiles[i];
        tile.disabled = false;
        tile.className = "tile";
        tile.textContent = "";
        tile.setAttribute("aria-label", `Tile ${i + 1}`);
      }

      $("bonus").classList.remove("pop");

      startedAt = performance.now();
      deadline = startedAt + SETTINGS.startTime * 1000;

      ghostInterval = SETTINGS.initialGhostInterval;
      nextGhostAt = startedAt + ghostInterval * 1000;

      startRound();
      render(startedAt);
      frameId = requestAnimationFrame(tick);
    }

    // Update from real timestamps rather than subtracting a fixed
    // amount per frame. Slow frames cannot give extra time.
    function advanceTo(now) {
      if (isGameOver) return false;

      // Ghost cannot earn points after the player's clock expires.
      const effectiveNow = Math.min(now, deadline);

      while (nextGhostAt <= effectiveNow) {
        ghostScore++;
        ghostInterval = ghostSpeedForScore();
        nextGhostAt += ghostInterval * 1000;
      }

      timeLeft = Math.max(0, (deadline - now) / 1000);

      if (now >= deadline) {
        finishGame("Time ran out!", deadline);
        return false;
      }

      return true;
    }

    function tick(now) {
      if (!advanceTo(now)) return;
      render(now);
      frameId = requestAnimationFrame(tick);
    }

    function render(now) {
      $("score").textContent = String(score);
      $("ghostScore").textContent = String(ghostScore);
      $("bestScore").textContent = String(bestScore);
      $("time").textContent = timeLeft.toFixed(2) + "s";

      // Bonus time is uncapped. The bar represents the initial
      // five-second reserve; the number displays the full balance.
      const timeFraction = Math.min(
        1,
        Math.max(0, timeLeft / SETTINGS.startTime)
      );

      $("timeFill").style.transform = `scaleX(${timeFraction})`;
      $("timerPanel").classList.toggle("urgent", timeLeft <= 1.5);

      const ghostProgress = Math.max(
        0,
        Math.min(
          1,
          1 - (nextGhostAt - now) / (ghostInterval * 1000)
        )
      );

      $("ghostFill").style.transform = `scaleX(${ghostProgress})`;
      $("ghostSpeed").textContent =
        ghostInterval.toFixed(2) + "s / tile";

      const lead = score - ghostScore;

      $("raceStatus").textContent = lead > 0
        ? `You lead by ${lead}!`
        : lead < 0
          ? `Ghost leads by ${-lead} — keep going!`
          : "Neck and neck!";

      $("raceStatus").style.color =
        lead > 0 ? "var(--green)" : "var(--purple)";
    }

    function handleTile(index) {
      if (isGameOver) return;

      const now = performance.now();

      // Check the deadline before granting a bonus.
      if (!advanceTo(now)) return;

      if (index !== targetIndex) {
        finishGame("Wrong tile! Tap only the green diamond.", now);
        return;
      }

      score++;
      deadline += SETTINGS.correctTapBonus * 1000;
      timeLeft = (deadline - now) / 1000;

      // Preserve the ghost's existing fractional progress while
      // adjusting its interval for the player's new score.
      const remainingFraction = Math.max(
        0,
        Math.min(1, (nextGhostAt - now) / (ghostInterval * 1000))
      );

      ghostInterval = ghostSpeedForScore();
      nextGhostAt = now + remainingFraction * ghostInterval * 1000;

      const tile = tiles[index];
      tile.classList.remove("tapped");
      void tile.offsetWidth;
      tile.classList.add("tapped");

      const bonus = $("bonus");
      bonus.classList.remove("pop");
      void bonus.offsetWidth;
      bonus.classList.add("pop");

      startRound();
      render(now);
    }

    function finishGame(reason, endedAt) {
      if (isGameOver) return;

      isGameOver = true;
      activePointer = null;
      cancelAnimationFrame(frameId);

      const newBest = score > bestScore;
      if (newBest) {
        bestScore = score;
        saveBestScore();
      }

      timeLeft = Math.max(0, (deadline - endedAt) / 1000);
      render(endedAt);

      grid.classList.add("failed");
      tiles.forEach(tile => {
        tile.disabled = true;
      });

      $("endReason").textContent = reason;
      $("finalScore").textContent = String(score);
      $("finalGhostScore").textContent = String(ghostScore);

      $("verdict").textContent =
        score > ghostScore
          ? "You beat the ghost!"
          : score < ghostScore
            ? "The ghost wins this round."
            : "A perfect tie!";

      const seconds = Math.max(0, (endedAt - startedAt) / 1000);
      $("runStats").textContent =
        `${seconds.toFixed(1)} seconds played · ` +
        (newBest ? "New personal best!" : `Best: ${bestScore}`);

      // Let the red flash appear before presenting the result.
      modalTimer = setTimeout(() => {
        if (!isGameOver) return;
        dialog.showModal();
        $("restart").focus();
      }, 240);
    }

    // Pointer Events give immediate touch, mouse, and pen response.
    // No separate touchstart/click pair that could double-score.
    grid.addEventListener("pointerdown", event => {
      const tile = event.target.closest(".tile");

      if (
        !tile ||
        isGameOver ||
        activePointer !== null ||
        event.button !== 0 ||
        !event.isPrimary
      ) {
        return;
      }

      event.preventDefault();
      activePointer = event.pointerId;
      handleTile(Number(tile.dataset.index));
    });

    function releasePointer(event) {
      if (event.pointerId === activePointer) activePointer = null;
    }

    window.addEventListener("pointerup", releasePointer);
    window.addEventListener("pointercancel", releasePointer);

    // Keyboard/accessibility activation generates a click with detail 0.
    grid.addEventListener("click", event => {
      const tile = event.target.closest(".tile");
      if (tile && event.detail === 0 && activePointer === null) {
        handleTile(Number(tile.dataset.index));
      }
    });

    window.addEventListener("blur", () => {
      activePointer = null;
    });

    // Leaving the page does not pause the countdown.
    // Reconcile elapsed time immediately when the player returns.
    document.addEventListener("visibilitychange", () => {
      activePointer = null;
      if (!document.hidden && !isGameOver) {
        advanceTo(performance.now());
      }
    });

    dialog.addEventListener("cancel", event => {
      // Keep the results visible until Play Again is selected.
      event.preventDefault();
    });

    $("restart").addEventListener("click", startGame);

    createBoard();
    startGame();
  </script>
</body>
</html>
